instance:
  id: albania-demo
  name: Kuvend (Synthetic Demo)
  country: AL
  languages:
    - sq
    - en
  timezone: Europe/Tirane

participation:
  authority: national_advisory
  eligibility: verified_international_phone_control
  credential_epoch_days: 30
  proposals:
    credential: synthetic_single_use
    fixed_quota: disabled
  voting:
    credential: synthetic_topic_scoped
    duration_days: 14
    final_after_confirmation: true
    live_turnout: true
    split_visibility: after_vote
  attachments: disabled

privacy:
  # Illustrative policy values, not production recommendations.
  issuance_epoch_minutes: 60
  publication_time_precision: day
  raw_ip_retention: disabled
  shared_analytics: disabled

funding:
  provider: github_sponsors
  influence: none

launch_gate:
  real_identities: blocked
  reason: unaudited_credential_protocol_and_no_independent_issuer
